name: Bug Report
description: Report a bug
title: 'bug: '
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Prerequisites
      options:
        - label:
            I have searched [existing
            issues](https://git.barrettruth.com/barrettruth/blink-cmp-tmux/issues)
          required: true
        - label: I have updated to the latest version
          required: true

  - type: textarea
    attributes:
      label: 'Neovim version'
      description: 'Output of `nvim --version`'
      render: text
    validations:
      required: true

  - type: input
    attributes:
      label: 'Operating system'
      placeholder: 'e.g. Arch Linux, macOS 15, Ubuntu 24.04'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Minimal reproduction
      description: |
        Save the script below as `repro.lua`, edit if needed, and run:
        ```
        nvim -u repro.lua
        ```
        Confirm the bug reproduces with this config before submitting.
      render: lua
      value: |
        vim.pack.add({
          'https://github.com/saghen/blink.cmp',
          'https://git.barrettruth.com/barrettruth/blink-cmp-tmux',
        })
        require('blink.cmp').setup({
          sources = {
            default = { 'tmux' },
            providers = {
              tmux = {
                name = 'Tmux',
                module = 'blink-cmp-tmux',
              },
            },
          },
        })
    validations:
      required: true
